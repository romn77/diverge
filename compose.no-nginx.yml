services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-diverge}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-diverge}"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: web/backend/Dockerfile
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - backend-tmp:/app/data
      - ./.env:/app/.env:ro
    environment:
      APP_ENV: production
      DATA_DIR: /app/data
      TASK_BACKEND: redis
      TASK_QUEUE_LIMIT: ${TASK_QUEUE_LIMIT:-2}
      TASK_GLOBAL_RUNNING_LIMIT: ${TASK_GLOBAL_RUNNING_LIMIT:-2}
      TASK_USER_RUNNING_LIMIT: ${TASK_USER_RUNNING_LIMIT:-1}
      TASK_GLOBAL_PENDING_LIMIT: ${TASK_GLOBAL_PENDING_LIMIT:-100}
      TASK_USER_PENDING_LIMIT_ADMIN: ${TASK_USER_PENDING_LIMIT_ADMIN:-10}
      TASK_USER_PENDING_LIMIT_OPERATOR: ${TASK_USER_PENDING_LIMIT_OPERATOR:-5}
      TASK_USER_PENDING_LIMIT_VIEWER: ${TASK_USER_PENDING_LIMIT_VIEWER:-2}
      TASK_STORE_TERMINAL_TTL_SECONDS: ${TASK_STORE_TERMINAL_TTL_SECONDS:-604800}
      SCREENER_PREWARM_ENABLED: ${SCREENER_PREWARM_ENABLED:-true}
      SCREENER_PREWARM_POLL_SECONDS: ${SCREENER_PREWARM_POLL_SECONDS:-300}
      REDIS_URL: redis://redis:6379/0
      STORAGE_BACKEND: ${STORAGE_BACKEND:-tencent_cos}
      DATA_SOURCE_USAGE_ALLOW_LOCAL_FALLBACK: ${DATA_SOURCE_USAGE_ALLOW_LOCAL_FALLBACK:-false}
      COS_SECRET_ID: ${COS_SECRET_ID:?Set COS_SECRET_ID in .env}
      COS_SECRET_KEY: ${COS_SECRET_KEY:?Set COS_SECRET_KEY in .env}
      COS_REGION: ${COS_REGION:?Set COS_REGION in .env}
      COS_BUCKET: ${COS_BUCKET:?Set COS_BUCKET in .env}
      COS_PREFIX: ${COS_PREFIX:-diverge/prod}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:?Set FRONTEND_ORIGIN in .env}
      AUTH_ENABLED: ${AUTH_ENABLED:-true}
      AUTH_MODE: ${AUTH_MODE:-required}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-diverge_session}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-168}
      SESSION_COOKIE_SAMESITE: ${SESSION_COOKIE_SAMESITE:-lax}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      AUTH_BOOTSTRAP_ADMIN_EMAIL: ${AUTH_BOOTSTRAP_ADMIN_EMAIL:?Set AUTH_BOOTSTRAP_ADMIN_EMAIL in .env}
      AUTH_BOOTSTRAP_ADMIN_PASSWORD: ${AUTH_BOOTSTRAP_ADMIN_PASSWORD:?Set AUTH_BOOTSTRAP_ADMIN_PASSWORD in .env}
      AUTH_BOOTSTRAP_ADMIN_DISPLAY_NAME: ${AUTH_BOOTSTRAP_ADMIN_DISPLAY_NAME:-Administrator}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "alembic -c web/backend/alembic.ini upgrade head
      && python -m web.backend.devops.bootstrap_admin
      && uvicorn web.backend.main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/healthz', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: web/backend/Dockerfile
    volumes:
      - backend-tmp:/app/data
      - ./.env:/app/.env:ro
    environment:
      APP_ENV: production
      DATA_DIR: /app/data
      TASK_BACKEND: redis
      TASK_QUEUE_LIMIT: ${TASK_QUEUE_LIMIT:-2}
      TASK_GLOBAL_RUNNING_LIMIT: ${TASK_GLOBAL_RUNNING_LIMIT:-2}
      TASK_USER_RUNNING_LIMIT: ${TASK_USER_RUNNING_LIMIT:-1}
      TASK_GLOBAL_PENDING_LIMIT: ${TASK_GLOBAL_PENDING_LIMIT:-100}
      TASK_USER_PENDING_LIMIT_ADMIN: ${TASK_USER_PENDING_LIMIT_ADMIN:-10}
      TASK_USER_PENDING_LIMIT_OPERATOR: ${TASK_USER_PENDING_LIMIT_OPERATOR:-5}
      TASK_USER_PENDING_LIMIT_VIEWER: ${TASK_USER_PENDING_LIMIT_VIEWER:-2}
      TASK_STORE_TERMINAL_TTL_SECONDS: ${TASK_STORE_TERMINAL_TTL_SECONDS:-604800}
      REDIS_URL: redis://redis:6379/0
      STORAGE_BACKEND: ${STORAGE_BACKEND:-tencent_cos}
      DATA_SOURCE_USAGE_ALLOW_LOCAL_FALLBACK: ${DATA_SOURCE_USAGE_ALLOW_LOCAL_FALLBACK:-false}
      COS_SECRET_ID: ${COS_SECRET_ID:?Set COS_SECRET_ID in .env}
      COS_SECRET_KEY: ${COS_SECRET_KEY:?Set COS_SECRET_KEY in .env}
      COS_REGION: ${COS_REGION:?Set COS_REGION in .env}
      COS_BUCKET: ${COS_BUCKET:?Set COS_BUCKET in .env}
      COS_PREFIX: ${COS_PREFIX:-diverge/prod}
      AUTH_ENABLED: ${AUTH_ENABLED:-true}
      AUTH_MODE: ${AUTH_MODE:-required}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["python", "-m", "web.backend.worker"]
    restart: unless-stopped

  frontend:
    build:
      context: ./web/frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:?Set NEXT_PUBLIC_API_BASE_URL in .env}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  backup:
    build:
      context: .
      dockerfile: web/backend/Dockerfile
    volumes:
      - postgres-backups:/app/backups
      - ./.env:/app/.env:ro
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      POSTGRES_DB: ${POSTGRES_DB:-diverge}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      STORAGE_BACKEND: ${STORAGE_BACKEND:-tencent_cos}
      COS_SECRET_ID: ${COS_SECRET_ID:?Set COS_SECRET_ID in .env}
      COS_SECRET_KEY: ${COS_SECRET_KEY:?Set COS_SECRET_KEY in .env}
      COS_REGION: ${COS_REGION:?Set COS_REGION in .env}
      COS_BUCKET: ${COS_BUCKET:?Set COS_BUCKET in .env}
      COS_PREFIX: ${COS_PREFIX:-diverge/prod}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
    depends_on:
      postgres:
        condition: service_healthy
    command: ["bash", "scripts/backup-postgres.sh"]
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  backend-tmp:
  postgres-backups:
