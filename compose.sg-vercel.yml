# SG API stack for the deployment where Vercel hosts web/frontend.
# Nginx terminates HTTPS and forwards API traffic to the backend only.
# Point Vercel NEXT_PUBLIC_API_BASE_URL at this public HTTPS API URL, and set
# FRONTEND_ORIGIN to the Vercel frontend origin.
x-backend-build: &backend-build
  build:
    context: .
    dockerfile: web/backend/Dockerfile

x-backend-volumes: &backend-volumes
  - ./data:/app/data
  - ./.env:/app/.env:ro

x-sentry-env: &sentry-env
  SENTRY_DSN: ${SENTRY_DSN:-}
  SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
  SENTRY_RELEASE: ${SENTRY_RELEASE:-}
  SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.05}
  SENTRY_ERROR_SAMPLE_RATE: ${SENTRY_ERROR_SAMPLE_RATE:-1.0}
  SENTRY_LOG_BREADCRUMB_LEVEL: ${SENTRY_LOG_BREADCRUMB_LEVEL:-INFO}
  SENTRY_LOG_EVENT_LEVEL: ${SENTRY_LOG_EVENT_LEVEL:-ERROR}
  SENTRY_INCLUDE_LOCAL_VARIABLES: ${SENTRY_INCLUDE_LOCAL_VARIABLES:-false}
  SENTRY_MAX_BREADCRUMBS: ${SENTRY_MAX_BREADCRUMBS:-50}
  SENTRY_SERVER_NAME: ${SENTRY_SERVER_NAME:-}

x-task-env: &task-env
  TASK_BACKEND: redis
  TASK_QUEUE_LIMIT: ${TASK_QUEUE_LIMIT:-2}
  TASK_GLOBAL_RUNNING_LIMIT: ${TASK_GLOBAL_RUNNING_LIMIT:-2}
  TASK_USER_RUNNING_LIMIT: ${TASK_USER_RUNNING_LIMIT:-1}
  TASK_GLOBAL_PENDING_LIMIT: ${TASK_GLOBAL_PENDING_LIMIT:-100}
  TASK_USER_PENDING_LIMIT_ADMIN: ${TASK_USER_PENDING_LIMIT_ADMIN:-10}
  TASK_USER_PENDING_LIMIT_OPERATOR: ${TASK_USER_PENDING_LIMIT_OPERATOR:-5}
  TASK_USER_PENDING_LIMIT_VIEWER: ${TASK_USER_PENDING_LIMIT_VIEWER:-2}
  TASK_STORE_TERMINAL_TTL_SECONDS: ${TASK_STORE_TERMINAL_TTL_SECONDS:-604800}
  REDIS_URL: redis://redis:6379/0

x-storage-env: &storage-env
  STORAGE_BACKEND: ${STORAGE_BACKEND:-tencent_cos}
  DATA_SOURCE_USAGE_ALLOW_LOCAL_FALLBACK: ${DATA_SOURCE_USAGE_ALLOW_LOCAL_FALLBACK:-false}
  COS_SECRET_ID: ${COS_SECRET_ID:?Set COS_SECRET_ID in .env}
  COS_SECRET_KEY: ${COS_SECRET_KEY:?Set COS_SECRET_KEY in .env}
  COS_REGION: ${COS_REGION:?Set COS_REGION in .env}
  COS_BUCKET: ${COS_BUCKET:?Set COS_BUCKET in .env}
  COS_PREFIX: ${COS_PREFIX:-diverge/prod}

x-auth-env: &auth-env
  AUTH_ENABLED: ${AUTH_ENABLED:-true}
  AUTH_MODE: ${AUTH_MODE:-required}
  DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
  SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-diverge_session}
  SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-168}
  SESSION_COOKIE_SAMESITE: ${SESSION_COOKIE_SAMESITE:-none}
  SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}

x-prewarm-env: &prewarm-env
  PREWARM_CN_READY_TIME: ${PREWARM_CN_READY_TIME:-18:10}
  PREWARM_CN_WINDOW_END: ${PREWARM_CN_WINDOW_END:-21:30}
  PREWARM_US_READY_TIME: ${PREWARM_US_READY_TIME:-21:10}
  PREWARM_US_WINDOW_END: ${PREWARM_US_WINDOW_END:-23:30}
  PREWARM_RETRY_DEFER_SECONDS: ${PREWARM_RETRY_DEFER_SECONDS:-300}
  PREWARM_MAX_TRIES: ${PREWARM_MAX_TRIES:-5}

services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-diverge}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-diverge}"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  backend:
    <<: *backend-build
    expose:
      - "8000"
    volumes: *backend-volumes
    environment:
      <<: [*sentry-env, *task-env, *storage-env, *auth-env]
      APP_ENV: production
      SENTRY_SERVICE: backend
      DATA_DIR: /app/data
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:?Set FRONTEND_ORIGIN to your Vercel frontend origin}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-172.16.0.0/12,127.0.0.1/32,::1/128}
      AUTH_BOOTSTRAP_ADMIN_EMAIL: ${AUTH_BOOTSTRAP_ADMIN_EMAIL:?Set AUTH_BOOTSTRAP_ADMIN_EMAIL in .env}
      AUTH_BOOTSTRAP_ADMIN_PASSWORD: ${AUTH_BOOTSTRAP_ADMIN_PASSWORD:?Set AUTH_BOOTSTRAP_ADMIN_PASSWORD in .env}
      AUTH_BOOTSTRAP_ADMIN_DISPLAY_NAME: ${AUTH_BOOTSTRAP_ADMIN_DISPLAY_NAME:-Administrator}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "alembic -c web/backend/alembic.ini upgrade head
      && python -m web.backend.devops.bootstrap_admin
      && uvicorn web.backend.main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/healthz', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/nginx/sg-api.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/certs:/etc/nginx/certs:ro
      - nginx-logs:/var/log/nginx
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  worker:
    <<: *backend-build
    volumes: *backend-volumes
    environment:
      <<: [*sentry-env, *task-env, *storage-env, *auth-env]
      APP_ENV: production
      SENTRY_SERVICE: worker
      DATA_DIR: /app/data
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["python", "-m", "web.backend.worker"]
    restart: unless-stopped

  prewarm-scheduler:
    <<: *backend-build
    volumes: *backend-volumes
    environment:
      <<: [*sentry-env, *prewarm-env]
      APP_ENV: production
      SENTRY_SERVICE: prewarm-scheduler
      DATA_DIR: /app/data
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    command: ["arq", "web.backend.runtime.prewarm_arq.PrewarmSchedulerSettings"]
    restart: unless-stopped

  prewarm-worker:
    <<: *backend-build
    volumes: *backend-volumes
    environment:
      <<: [*sentry-env, *task-env, *storage-env, *auth-env, *prewarm-env]
      APP_ENV: production
      SENTRY_SERVICE: prewarm-worker
      DATA_DIR: /app/data
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["arq", "web.backend.runtime.prewarm_arq.PrewarmWorkerSettings"]
    stop_grace_period: 10m
    restart: unless-stopped

  backup:
    <<: *backend-build
    volumes:
      - postgres-backups:/app/backups
      - ./.env:/app/.env:ro
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      POSTGRES_DB: ${POSTGRES_DB:-diverge}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      <<: *storage-env
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
    depends_on:
      postgres:
        condition: service_healthy
    command: ["bash", "scripts/backup-postgres.sh"]
    restart: unless-stopped

  dozzle:
    image: amir20/dozzle:latest
    profiles:
      - ops
    ports:
      - "127.0.0.1:${DOZZLE_PORT:-9999}:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  postgres-backups:
  nginx-logs:
