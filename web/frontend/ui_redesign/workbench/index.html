<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diverge — Workbench UI Kit</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <style>
    body { margin: 0; }
    #root { height: 100vh; display: flex; flex-direction: column; }

    /* Topbar */
    .topbar {
      height: 52px; flex-shrink: 0;
      border-bottom: 1px solid var(--border);
      background: rgba(255,253,248,0.95);
      backdrop-filter: blur(8px);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 18px; gap: 12px;
    }
    .topbar-left { display: flex; align-items: center; gap: 10px; }
    .menu-btn { background: none; border: 1px solid var(--border); border-radius: 10px; width: 34px; height: 34px; cursor: pointer; display: grid; place-items: center; color: #64748b; }
    .topbar-breadcrumb { font-size: 12px; font-weight: 600; color: #94a3b8; letter-spacing: 0.04em; }
    .topbar-right { display: flex; align-items: center; gap: 10px; }
    .user-chip { display: flex; align-items: center; gap: 8px; border-radius: 9999px; border: 1px solid var(--border); background: rgba(255,255,255,0.8); padding: 5px 12px 5px 6px; cursor: pointer; }
    .user-avatar { width: 26px; height: 26px; border-radius: 50%; background: var(--primary); display: grid; place-items: center; color: var(--primary-foreground); font-size: 11px; font-weight: 700; }
    .user-name { font-size: 12px; font-weight: 600; color: var(--text); }

    /* New Analysis Modal overlay */
    .modal-overlay { position: fixed; inset: 0; background: rgba(18,28,41,0.3); backdrop-filter: blur(6px); z-index: 100; display: flex; align-items: center; justify-content: center; padding: 24px; }
    .modal-panel { background: linear-gradient(180deg,rgba(255,253,248,0.98) 0%,rgba(255,248,238,0.94) 100%); border: 1px solid rgba(22,34,51,0.1); border-radius: 28px; box-shadow: 0 40px 80px rgba(18,28,41,0.14); padding: 28px 32px; width: 100%; max-width: 560px; max-height: 90vh; overflow-y: auto; }
    .modal-label { display: block; margin-bottom: 14px; }
    .modal-label span { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.22em; color: var(--muted); display: block; margin-bottom: 6px; }
    .analyst-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; }
    .analyst-chip { border-radius: 12px; border: 1px solid var(--border); background: var(--surface); padding: 10px 12px; cursor: pointer; font-family: var(--font-body); font-size: 12px; font-weight: 600; color: #334155; text-align: left; transition: all 150ms; }
    .analyst-chip.selected { border-color: var(--primary); background: var(--primary-soft); color: var(--primary-strong); }

    /* Toast */
    .toast { position: fixed; bottom: 24px; right: 24px; background: #1c2430; color: #f5f2ec; border-radius: 18px; padding: 12px 20px; font-size: 13px; font-weight: 500; box-shadow: 0 20px 40px rgba(18,28,41,0.2); z-index: 200; animation: rise-in 300ms ease both; }
  </style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="Sidebar.jsx"></script>
<script type="text/babel" src="Screens.jsx"></script>

<script type="text/babel">
const ANALYSTS = ["Fundamentals","Sentiment","News","Technical","Macro","Social"];
const PROVIDERS = ["openai","anthropic","google","deepseek"];
const DEPTHS = [{v:1,l:"Shallow"},{v:3,l:"Medium"},{v:5,l:"Deep"}];

function NewAnalysisModal({ onClose, onSubmit }) {
  const [ticker, setTicker] = React.useState("");
  const [analysts, setAnalysts] = React.useState(["Fundamentals","Technical"]);
  const [provider, setProvider] = React.useState("openai");
  const [depth, setDepth] = React.useState(3);
  const [loading, setLoading] = React.useState(false);
  const toggle = a => setAnalysts(prev => prev.includes(a) ? prev.filter(x=>x!==a) : [...prev,a]);
  const submit = () => {
    if (!ticker.trim() || analysts.length === 0) return;
    setLoading(true);
    setTimeout(() => { setLoading(false); onSubmit(ticker.toUpperCase()); }, 700);
  };

  return (
    <div className="modal-overlay" onClick={e=>e.target===e.currentTarget&&onClose()}>
      <div className="modal-panel fade-in">
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:22}}>
          <div>
            <div className="kicker">New Analysis</div>
            <h2 style={{fontFamily:"var(--font-heading)",fontSize:"1.6rem",fontWeight:700,color:"#0f1923",marginTop:8,letterSpacing:"-0.02em"}}>Launch research task</h2>
          </div>
          <button onClick={onClose} style={{background:"none",border:"1px solid var(--border)",borderRadius:10,width:34,height:34,cursor:"pointer",display:"grid",placeItems:"center",color:"#64748b"}}>
            <svg viewBox="0 0 16 16" width="14" height="14" fill="none"><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" strokeWidth="1.7" strokeLinecap="round"/></svg>
          </button>
        </div>

        <label className="modal-label">
          <span>Ticker Symbol</span>
          <input type="text" value={ticker} onChange={e=>setTicker(e.target.value.toUpperCase())} placeholder="NVDA" style={{textTransform:"uppercase"}} />
        </label>

        <label className="modal-label">
          <span>Analysis Date</span>
          <input type="date" defaultValue="2026-04-27" />
        </label>

        <div style={{marginBottom:16}}>
          <div style={{fontSize:10,fontWeight:700,textTransform:"uppercase",letterSpacing:"0.22em",color:"var(--muted)",marginBottom:8}}>Analysts</div>
          <div className="analyst-grid">
            {ANALYSTS.map(a => (
              <button key={a} onClick={()=>toggle(a)} className={"analyst-chip"+(analysts.includes(a)?" selected":"")}>{a}</button>
            ))}
          </div>
        </div>

        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:20}}>
          <label className="modal-label" style={{marginBottom:0}}>
            <span>LLM Provider</span>
            <select value={provider} onChange={e=>setProvider(e.target.value)}>
              {PROVIDERS.map(p=><option key={p} value={p}>{p}</option>)}
            </select>
          </label>
          <div>
            <div style={{fontSize:10,fontWeight:700,textTransform:"uppercase",letterSpacing:"0.22em",color:"var(--muted)",marginBottom:8}}>Depth</div>
            <div style={{display:"flex",gap:6}}>
              {DEPTHS.map(d=>(
                <button key={d.v} onClick={()=>setDepth(d.v)} style={{flex:1,borderRadius:10,border:"1px solid",borderColor:depth===d.v?"var(--primary)":"var(--border)",background:depth===d.v?"var(--primary-soft)":"var(--surface)",color:depth===d.v?"var(--primary-strong)":"#334155",padding:"8px 4px",fontSize:11,fontWeight:700,cursor:"pointer",fontFamily:"var(--font-body)"}}>{d.l}</button>
              ))}
            </div>
          </div>
        </div>

        <Btn variant="primary" onClick={submit} disabled={!ticker.trim()||analysts.length===0||loading} style={{width:"100%"}}>
          {loading ? "Launching…" : "Launch Analysis"}
        </Btn>
      </div>
    </div>
  );
}

function Topbar({ screen, onOpenSidebar, onNewAnalysis, onNewScreener }) {
  const labels = { home:"Analysis", screener:"Screener", assets:"Assets", journal:"Journal", activity:"Activity", task:"Task Progress", login:"Login" };
  return (
    <div className="topbar">
      <div className="topbar-left">
        <button className="menu-btn" onClick={onOpenSidebar} aria-label="Open sidebar">
          <svg viewBox="0 0 16 16" width="16" height="16" fill="none"><path d="M2 4h12M2 8h12M2 12h12" stroke="currentColor" strokeWidth="1.7" strokeLinecap="round"/></svg>
        </button>
        <span className="topbar-breadcrumb">Diverge / {labels[screen] || screen}</span>
      </div>
      <div className="topbar-right">
        {screen === "home" && <Btn variant="primary" size="sm" onClick={onNewAnalysis}>+ New Analysis</Btn>}
        {screen === "screener" && <Btn variant="accent" size="sm" onClick={onNewScreener}>+ New Screener</Btn>}
        <div className="user-chip">
          <div className="user-avatar">A</div>
          <span className="user-name">Analyst</span>
        </div>
      </div>
    </div>
  );
}

function App() {
  const savedScreen = (() => { try { return localStorage.getItem("diverge_screen") || "login"; } catch { return "login"; } })();
  const [screen, setScreen] = React.useState(savedScreen);
  const [openReport, setOpenReport] = React.useState(null);
  const [showNewAnalysis, setShowNewAnalysis] = React.useState(false);
  const [showNewScreener, setShowNewScreener] = React.useState(false);
  const [toast, setToast] = React.useState(null);
  const [sidebarMobileOpen, setSidebarMobileOpen] = React.useState(false);

  const navigate = (s) => { setScreen(s); try { localStorage.setItem("diverge_screen",""+s); } catch {} };

  const showToast = (msg) => {
    setToast(msg);
    setTimeout(() => setToast(null), 3000);
  };

  const handleLogin = () => { navigate("home"); showToast("Signed in successfully"); };
  const handleNewAnalysis = (ticker) => { setShowNewAnalysis(false); navigate("task"); showToast(`Analysis launched for ${ticker}`); };
  const handleOpenReport = (r) => { setOpenReport(r); navigate("task"); };

  if (screen === "login") {
    return <LoginScreen onLogin={handleLogin} />;
  }

  return (
    <div style={{display:"flex",flexDirection:"column",height:"100vh",overflow:"hidden"}}>
      <Topbar
        screen={screen}
        onOpenSidebar={() => setSidebarMobileOpen(v => !v)}
        onNewAnalysis={() => setShowNewAnalysis(true)}
        onNewScreener={() => setShowNewScreener(true)}
      />
      <div style={{flex:1,display:"flex",overflow:"hidden"}}>
        <Sidebar active={screen} onNavigate={navigate} activeTaskCount={2} />
        {screen === "home"     && <HomeScreen onNewAnalysis={()=>setShowNewAnalysis(true)} onOpenTask={handleOpenReport} />}
        {screen === "screener" && <ScreenerScreen onNewScreener={()=>setShowNewScreener(true)} />}
        {screen === "task"     && <TaskScreen report={openReport} onBack={()=>navigate("home")} />}
        {screen === "assets"   && <AssetsScreen />}
        {screen === "journal"  && (
          <main style={{flex:1,display:"flex",alignItems:"center",justifyContent:"center",padding:32}}>
            <div className="card" style={{padding:"40px 48px",textAlign:"center",maxWidth:440}}>
              <div className="kicker">Journal</div>
              <h2 style={{fontFamily:"var(--font-heading)",fontSize:"1.8rem",fontWeight:700,color:"#0f1923",marginTop:10}}>Trade review</h2>
              <p style={{fontSize:13,color:"#566779",marginTop:10,lineHeight:1.7}}>Record and review your trade history, annotate decisions, and track outcomes against your research.</p>
              <div style={{marginTop:20}}><Btn variant="primary">Add Trade Record</Btn></div>
            </div>
          </main>
        )}
        {screen === "activity" && (
          <main style={{flex:1,overflowY:"auto",padding:"24px 28px"}}>
            <div style={{maxWidth:800,margin:"0 auto"}}>
              <div className="card fade-in" style={{padding:"28px 32px",marginBottom:20}}>
                <div className="kicker">Activity</div>
                <h1 style={{fontSize:"2rem",fontWeight:600,letterSpacing:"-0.025em",color:"#0f1923",marginTop:10}}>Background work</h1>
                <p style={{fontSize:13,color:"#566779",marginTop:8,lineHeight:1.7}}>2 analysis tasks running. Screener idle.</p>
              </div>
              {[{ticker:"NVDA",status:"processing",stage:"Research"},{ticker:"TSLA",status:"pending",stage:"Queued"}].map(t=>(
                <div key={t.ticker} className="card fade-in" style={{padding:"18px 22px",marginBottom:10,display:"flex",alignItems:"center",justifyContent:"space-between",gap:12}}>
                  <div><span style={{fontSize:16,fontWeight:700,color:"#0f1923"}}>{t.ticker}</span><div style={{fontFamily:"var(--font-mono)",fontSize:10,color:"#7a8fa0",marginTop:3}}>{t.stage}</div></div>
                  <Badge variant={t.status==="processing"?"info":"secondary"}>{t.status}</Badge>
                </div>
              ))}
            </div>
          </main>
        )}
      </div>

      {showNewAnalysis && (
        <NewAnalysisModal onClose={()=>setShowNewAnalysis(false)} onSubmit={handleNewAnalysis} />
      )}

      {showNewScreener && (
        <div className="modal-overlay" onClick={e=>e.target===e.currentTarget&&setShowNewScreener(false)}>
          <div className="modal-panel fade-in" style={{maxWidth:480}}>
            <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:20}}>
              <div>
                <div style={{fontSize:11,fontWeight:700,letterSpacing:"0.24em",textTransform:"uppercase",color:"var(--accent)"}}>New Screener</div>
                <h2 style={{fontFamily:"var(--font-heading)",fontSize:"1.5rem",fontWeight:700,color:"#0f1923",marginTop:8}}>Launch screen run</h2>
              </div>
              <button onClick={()=>setShowNewScreener(false)} style={{background:"none",border:"1px solid var(--border)",borderRadius:10,width:34,height:34,cursor:"pointer",display:"grid",placeItems:"center",color:"#64748b"}}>
                <svg viewBox="0 0 16 16" width="14" height="14" fill="none"><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" strokeWidth="1.7" strokeLinecap="round"/></svg>
              </button>
            </div>
            <label className="modal-label"><span>Markets</span>
              <select defaultValue="us"><option value="us">US</option><option value="cn">CN</option><option value="us,cn">US + CN</option></select>
            </label>
            <label className="modal-label"><span>Date</span><input type="date" defaultValue="2026-04-27" /></label>
            <label className="modal-label"><span>Top-K Candidates</span><input type="number" defaultValue="100" min="10" max="500" /></label>
            <Btn variant="accent" onClick={()=>{setShowNewScreener(false);showToast("Screener task launched");}} style={{width:"100%"}}>Launch Screen</Btn>
          </div>
        </div>
      )}

      {toast && <div className="toast">{toast}</div>}

      {/* Login link when on workbench */}
      <div style={{position:"fixed",bottom:16,left:16,zIndex:50}}>
        <button onClick={()=>navigate("login")} style={{background:"rgba(255,253,248,0.88)",border:"1px solid var(--border)",borderRadius:12,padding:"6px 12px",fontSize:11,fontWeight:600,color:"var(--muted)",cursor:"pointer",fontFamily:"var(--font-body)",backdropFilter:"blur(6px)"}}>← Login screen</button>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
<template id="__bundler_thumbnail">
  <svg viewBox="0 0 120 80" xmlns="http://www.w3.org/2000/svg">
    <rect width="120" height="80" fill="#f5f2ec"/>
    <rect x="0" y="0" width="28" height="80" fill="rgba(255,253,248,0.98)" stroke="rgba(28,36,48,0.12)" stroke-width="0.5"/>
    <circle cx="14" cy="14" r="7" fill="none" stroke="#1c2430" stroke-width="1.5"/>
    <path d="M14 19v-7M14 12 9 7M14 12l5-5" stroke="#1c2430" stroke-width="1.5" stroke-linecap="round"/>
    <rect x="4" y="28" width="20" height="8" rx="4" fill="rgba(93,116,112,0.16)" stroke="rgba(28,36,48,0.16)" stroke-width="0.5"/>
    <rect x="4" y="40" width="20" height="8" rx="4" fill="none" stroke="rgba(28,36,48,0.1)" stroke-width="0.5"/>
    <rect x="32" y="8" width="80" height="28" rx="6" fill="rgba(255,253,248,0.96)" stroke="rgba(22,34,51,0.1)" stroke-width="0.5"/>
    <rect x="38" y="14" width="30" height="4" rx="2" fill="#1c2430" opacity="0.8"/>
    <rect x="38" y="20" width="50" height="3" rx="1.5" fill="#5d7470" opacity="0.5"/>
    <rect x="32" y="44" width="36" height="28" rx="6" fill="rgba(255,249,240,0.92)" stroke="rgba(22,34,51,0.1)" stroke-width="0.5"/>
    <rect x="76" y="44" width="36" height="13" rx="6" fill="rgba(255,253,248,0.96)" stroke="rgba(22,34,51,0.1)" stroke-width="0.5"/>
    <rect x="76" y="59" width="36" height="13" rx="6" fill="rgba(255,253,248,0.96)" stroke="rgba(22,34,51,0.1)" stroke-width="0.5"/>
  </svg>
</template>
</body>
</html>
