services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tradingagents}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-tradingagents}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: web/backend/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./.env:/app/.env:ro
    environment:
      REPORTS_DIR: /app/data/reports
      SCREENER_RUNS_DIR: /app/data/screener/runs
      SCREENER_TASKS_DIR: /app/data/screener/tasks
      SCREENER_CACHE_DIR: /app/data/cache/screener
      STOCK_HISTORY_DIR: /app/data/history
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3000}
      AUTH_ENABLED: ${AUTH_ENABLED:-true}
      AUTH_MODE: ${AUTH_MODE:-required}
      TASK_BACKEND: ${TASK_BACKEND:-local}
      TASK_QUEUE_LIMIT: ${TASK_QUEUE_LIMIT:-2}
      TASK_GLOBAL_RUNNING_LIMIT: ${TASK_GLOBAL_RUNNING_LIMIT:-2}
      TASK_USER_RUNNING_LIMIT: ${TASK_USER_RUNNING_LIMIT:-1}
      TASK_GLOBAL_PENDING_LIMIT: ${TASK_GLOBAL_PENDING_LIMIT:-100}
      TASK_USER_PENDING_LIMIT_ADMIN: ${TASK_USER_PENDING_LIMIT_ADMIN:-10}
      TASK_USER_PENDING_LIMIT_OPERATOR: ${TASK_USER_PENDING_LIMIT_OPERATOR:-5}
      TASK_USER_PENDING_LIMIT_VIEWER: ${TASK_USER_PENDING_LIMIT_VIEWER:-2}
      SCREENER_PREWARM_ENABLED: ${SCREENER_PREWARM_ENABLED:-true}
      SCREENER_PREWARM_POLL_SECONDS: ${SCREENER_PREWARM_POLL_SECONDS:-300}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-tradingagents_session}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-168}
      SESSION_COOKIE_SAMESITE: ${SESSION_COOKIE_SAMESITE:-lax}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      AUTH_BOOTSTRAP_ADMIN_EMAIL: ${AUTH_BOOTSTRAP_ADMIN_EMAIL:?Set AUTH_BOOTSTRAP_ADMIN_EMAIL in .env}
      AUTH_BOOTSTRAP_ADMIN_PASSWORD: ${AUTH_BOOTSTRAP_ADMIN_PASSWORD:?Set AUTH_BOOTSTRAP_ADMIN_PASSWORD in .env}
      AUTH_BOOTSTRAP_ADMIN_DISPLAY_NAME: ${AUTH_BOOTSTRAP_ADMIN_DISPLAY_NAME:-Administrator}
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "alembic -c web/backend/alembic.ini upgrade head
      && python -m web.backend.devops.bootstrap_admin
      && uvicorn web.backend.main:app --host 0.0.0.0 --port 8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./web/frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres-data:
