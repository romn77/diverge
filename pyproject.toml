[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "diverge"
version = "0.2.3"
description = "Diverge: Multi-Agents LLM Financial Trading Framework"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "langchain-core>=0.3.81",
    "backtrader>=1.9.78.123",
    "langchain-anthropic>=0.3.15",
    "langchain-experimental>=0.3.4",
    "langchain-google-genai>=4.0.0",
    "langchain-openai>=0.3.23",
    "langgraph>=0.4.8",
    "pandas>=2.3.0",
    "parsel>=1.10.0",
    "pytz>=2025.2",
    "rank-bm25>=0.2.2",
    "redis>=6.2.0",
    "requests>=2.32.4",
    "rich>=14.0.0",
    "setuptools>=80.9.0",
    "stockstats>=0.6.5",
    "simfin>=1.0.1",
    "tqdm>=4.67.1",
    "typing-extensions>=4.14.0",
    "yfinance>=0.2.63",
    "akshare>=1.18.30",
    "tushare>=1.4.24",
    "httpx[socks]>=0.28.1",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "sqlalchemy>=2.0.41",
    "alembic>=1.15.2",
    "psycopg[binary]>=3.2.6",
    "argon2-cffi>=23.1.0",
    "cos-python-sdk-v5>=1.9.37",
]

[dependency-groups]
dev = [
    "pytest>=8.3.5",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "sqlalchemy>=2.0.41",
    "alembic>=1.15.2",
    "psycopg[binary]>=3.2.6",
    "argon2-cffi>=23.1.0",
]

[tool.setuptools.packages.find]
include = ["diverge*"]
